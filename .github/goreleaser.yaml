# GoReleaser — builds the pure-Go t7kb binary for Windows + Linux, bundles the
# embedding model for offline use, and cuts a GitHub Release with a changelog
# generated from conventional commits.
#
# The version comes from the pushed git tag (e.g. v0.1.0). t7kb.db is NOT built
# here (large, built upstream in t7_knowledge) — the release workflow carries it
# forward from the previous release.
#
# Validate locally:  goreleaser check   ·   dry-run:  goreleaser release --snapshot --clean
version: 2

before:
  hooks:
    - go mod tidy
    # Populate ./models with the embedding model once, so both archives can
    # bundle it for offline use (the binary loads it from beside itself).
    - sh -c 'HF_HOME="$(pwd)/models" go run ./cmd/t7kb embed warmup'

builds:
  - id: t7kb
    main: ./cmd/t7kb
    binary: t7kb
    env:
      - CGO_ENABLED=0 # pure Go — no C toolchain, clean cross-compile
    goos: [linux, windows]
    goarch: [amd64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/McReaper/t7_companion/internal/cli.version={{ .Version }}

archives:
  - id: t7kb
    name_template: "t7kb_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - src: docs/NOTICE.md
        strip_parent: true
      - LICENSE
      - models/**/* # the bundled embedding model (offline)

# Auto-generated changelog, sandwiched between the hand-curated header/footer
# below. Only what a user would notice makes it in: features, fixes, and skill
# knowledge (docs(skills) ships to plugin users). ci/chore/test/refactor and
# repo docs match no group, so GoReleaser drops them. Each line shows the
# subject without its "type(scope):" prefix, the scope kept as a bold label.
# A hand-written .github/release-notes/<tag>.md, if present, is added on top
# by the release workflow.
changelog:
  disable: false
  use: git
  sort: asc
  format: >-
    {{ $p := split .Message ": " }}{{ if gt (len $p) 1 }}{{ $h := index $p 0 }}{{ if contains $h "(" }}**{{ index (split (index (split $h "(") 1) ")") 0 }}:** {{ end }}{{ trimprefix .Message (print $h ": ") }}{{ else }}{{ .Message }}{{ end }}
  groups:
    - title: "✨ New"
      regexp: '^feat(\(.+\))?!?:.+$'
      order: 0
    - title: "🐛 Fixed"
      regexp: '^fix(\(.+\))?!?:.+$'
      order: 1
    - title: "📚 Skill knowledge"
      regexp: '^docs\(skills\)!?:.+$'
      order: 2

release:
  # owner/repo are auto-detected from the git remote.
  name_template: "t7kb {{ .Tag }}"
  header: |
    Agent-first hybrid search (keyword + semantic) over a local Black Ops 3 modding knowledge base — one pure-Go binary exposing an MCP server (for AI agents) and a small CLI, querying a bundled SQLite index. Runs fully offline.
  footer: |
    ## Install

    **Claude Code:** skip the manual steps below — the plugin does this for you:
    ```
    /plugin marketplace add McReaper/t7_companion
    /plugin install t7kb@t7-reapy
    /reload-plugins
    /t7kb:setup
    ```

    **Any other MCP-capable agent (Codex, OpenCode, Cursor, Copilot, ...):** paste this release page, or the [README](https://github.com/McReaper/t7_companion), to your agent and it can run the steps below itself — or do it by hand:

    1. Download your OS archive (`t7kb_windows_amd64.zip` or `t7kb_linux_amd64.tar.gz`) **and** `t7kb.db.zip`.
    2. Extract the OS archive at your **Black Ops III root**.
    3. Drop `t7kb.db.zip` into the same folder, next to the binary — it is unpacked automatically on first run.
    4. Register `t7kb mcp` as an MCP stdio server with your agent.

    Everything runs locally and offline.

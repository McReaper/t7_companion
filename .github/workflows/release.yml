# Cuts a GitHub Release via GoReleaser when a v* tag is pushed: builds the
# pure-Go binaries (Windows + Linux), bundles the embedding model, and generates
# the changelog from conventional commits. See .github/goreleaser.yaml.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog can diff tags

      - name: Verify plugin manifest version matches the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::plugin.json version ($manifest) does not match release tag ($tag). Bump plugin/.claude-plugin/plugin.json's version to $tag before tagging." >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --config .github/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional hand-written highlights: if .github/release-notes/<tag>.md exists
      # at the tag, it goes on top of the generated changelog. Without one the
      # release keeps GoReleaser's notes as they are. Re-runs don't add it twice.
      - name: Add the hand-written highlights, if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ ! -f "$notes" ]; then
            echo "no $notes — keeping the generated notes"
            exit 0
          fi
          body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          if grep -qxF "$(head -n1 "$notes")" <<<"$body"; then
            echo "highlights already in the release notes"
            exit 0
          fi
          # Split around the generated heading rather than ${body/…/…}: in bash 5.2
          # an "&" in the replacement would expand to the matched text.
          printf '%s%s\n\n## All changes%s\n' "${body%%## Changelog*}" "$(cat "$notes")" "${body#*## Changelog}" > "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

      # t7kb.db.zip is built upstream and too large for GoReleaser, so each release
      # would otherwise ship without it. Carry the newest one forward from the most
      # recent earlier release that has it. Idempotent: a release that already has
      # the asset (e.g. a freshly rebuilt DB uploaded by hand) is left alone.
      - name: Carry the knowledge base forward from the previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          has_db() { gh release view "$1" --json assets --jq '.assets[].name' | grep -qx 't7kb.db.zip'; }
          if has_db "$tag"; then
            echo "$tag already has t7kb.db.zip — nothing to do"
            exit 0
          fi
          src=""
          for t in $(gh release list --limit 50 --json tagName --jq '.[].tagName'); do
            [ "$t" = "$tag" ] && continue
            if has_db "$t"; then src="$t"; break; fi
          done
          if [ -z "$src" ]; then
            echo "::warning::no earlier release has t7kb.db.zip — upload it by hand: gh release upload $tag t7kb.db.zip"
            exit 0
          fi
          echo "copying t7kb.db.zip from $src to $tag"
          gh release download "$src" --pattern t7kb.db.zip --dir "$RUNNER_TEMP"
          gh release upload "$tag" "$RUNNER_TEMP/t7kb.db.zip"

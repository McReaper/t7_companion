name: ci

# Build, lint and test the Go tool on every PR and push to main. Pure Go, no cgo:
# the Windows binary is cross-compiled here exactly as the release does.
on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - ".github/scripts/patch_coverage.py"
      - ".golangci.yml"
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - ".golangci.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      HF_HOME: ${{ github.workspace }}/.hf # the embedding model TestHybridSearch loads
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the PR's base, for the coverage of its changed lines
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .hf
          key: hf-all-MiniLM-L6-v2
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint # staticcheck, errcheck, complexity and size limits: .golangci.yml
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: build
        run: go build ./...
      - name: cross-compile (release targets)
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/t7kb
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/t7kb
      - name: test
        run: go test -coverpkg=./... -coverprofile=cover.out ./...
      - name: coverage of the changed lines # at least 80% of a PR's changed Go lines run under test
        if: github.event_name == 'pull_request'
        shell: bash
        run: python3 .github/scripts/patch_coverage.py cover.out "origin/${{ github.base_ref }}" 80 "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"

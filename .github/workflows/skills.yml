name: skills

# Validates the plugin's skills and the repo's markdown on every PR that touches
# them: check_skills.py (skill format) and .github/scripts/check_markdown.py
# (word budgets per kind of file) — the same checks the pre-commit hook runs.
on:
  pull_request:
    paths:
      - "plugin/**"
      - "templates/**"
      - ".claude-plugin/**"
      - "**.md"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "templates/**"
      - ".claude-plugin/**"
      - "**.md"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate skills
        run: python plugin/skills/contribute/scripts/check_skills.py
      - name: Markdown word budgets
        run: python .github/scripts/check_markdown.py
      - name: Validate JSON manifests
        run: |
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool plugin/.claude-plugin/plugin.json > /dev/null
